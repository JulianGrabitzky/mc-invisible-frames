name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Build NeoForge mod
        run: ./gradlew :neoforge:build --no-daemon --stacktrace

      - name: Run GameTests
        run: ./gradlew :neoforge:runGameTestServer --no-daemon --stacktrace

      - name: Upload production mod
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: invisibleframes-neoforge
          path: neoforge/build/libs/invisibleframes-*-neoforge.jar
          if-no-files-found: error

      - name: Upload failure reports and GameTest logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-failure-reports
          path: |
            neoforge/build/reports/
            neoforge/build/test-results/
            neoforge/run-gametest/logs/
          if-no-files-found: ignore
